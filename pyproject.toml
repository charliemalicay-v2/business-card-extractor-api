[project]
name = "business-card-extractor-api"
version = "0.1.0"
description = "REST API that extracts structured contact data from business card images (OCR + QR + local LLM)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "RUF"]
ignore = [
    "B008",  # Depends(...) in argument defaults is the standard FastAPI dependency-injection idiom.
]

[tool.ruff.lint.per-file-ignores]
"app/services/llm/extraction_service.py" = ["E501"]  # long lines are natural-language LLM prompt text.
